<svg xmlns="http://www.w3.org/2000/svg" width="440pt" height="618pt" viewBox="0 0 440 618">
<title>VM migration with vfio-user</title>
<desc>Generic CPU and device handover during VM migration with vfio-user. The VMMs coordinate guest-memory handling according to the selected migration method; the figure does not prescribe memory-transfer timing. Source CPUs and the device stop before final CPU and device-state transfer. The destination imports device state and restores CPU state before resuming execution. DMA dirty logging, when supported and enabled, tracks device writes until the device stops; a final bitmap feeds guest-memory handling. Boxes denote local actions and dashed arrows selected replies. State reads and writes repeat until complete.</desc>
<defs><marker id="arrow" markerWidth="5" markerHeight="5" refX="5" refY="2.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L5 2.5 L0 5 Z" fill="#333"/></marker></defs>
<rect width="440" height="618" fill="white"/>
<g font-family="sans-serif" fill="#171717">
<rect x="11" y="5" width="88" height="36" fill="#f7f7f7" stroke="#888" stroke-width="0.6"/>
<text x="55" y="18" font-size="10" font-weight="600" text-anchor="middle">Source</text>
<text x="55" y="32" font-size="8.5" font-weight="400" text-anchor="middle">Backend (server)</text>
<path d="M55 41 V610" stroke="#aaa" stroke-width="0.6" stroke-dasharray="1 3"/>
<rect x="121" y="5" width="88" height="36" fill="#f7f7f7" stroke="#888" stroke-width="0.6"/>
<text x="165" y="18" font-size="10" font-weight="600" text-anchor="middle">Source</text>
<text x="165" y="32" font-size="8.5" font-weight="400" text-anchor="middle">VMM (client)</text>
<path d="M165 41 V610" stroke="#aaa" stroke-width="0.6" stroke-dasharray="1 3"/>
<rect x="241" y="5" width="88" height="36" fill="#f7f7f7" stroke="#888" stroke-width="0.6"/>
<text x="285" y="18" font-size="10" font-weight="600" text-anchor="middle">Destination</text>
<text x="285" y="32" font-size="8.5" font-weight="400" text-anchor="middle">VMM (client)</text>
<path d="M285 41 V610" stroke="#aaa" stroke-width="0.6" stroke-dasharray="1 3"/>
<rect x="351" y="5" width="88" height="36" fill="#f7f7f7" stroke="#888" stroke-width="0.6"/>
<text x="395" y="18" font-size="10" font-weight="600" text-anchor="middle">Destination</text>
<text x="395" y="32" font-size="8.5" font-weight="400" text-anchor="middle">Backend (server)</text>
<path d="M395 41 V610" stroke="#aaa" stroke-width="0.6" stroke-dasharray="1 3"/>
<rect x="5" y="49" width="430" height="18" fill="#eaeaea" stroke="none" stroke-width="0.6"/>
<text x="12" y="61.5" font-size="9.5" font-weight="600">1  Prepare migration</text>
<text x="110.0" y="78" font-size="8.5" font-weight="400" text-anchor="middle">Check migration and</text>
<text x="110.0" y="88" font-size="8.5" font-weight="400" text-anchor="middle">DMA logging support</text>
<path d="M165 94 H55" fill="none" stroke="#333" stroke-width="0.8" marker-end="url(#arrow)"/>
<text x="340.0" y="78" font-size="8.5" font-weight="400" text-anchor="middle">Connect and</text>
<text x="340.0" y="88" font-size="8.5" font-weight="400" text-anchor="middle">check migration support</text>
<path d="M285 94 H395" fill="none" stroke="#333" stroke-width="0.8" marker-end="url(#arrow)"/>
<text x="110.0" y="115" font-size="8.5" font-weight="400" text-anchor="middle">Enable DMA logging*</text>
<path d="M165 121 H55" fill="none" stroke="#333" stroke-width="0.8" marker-end="url(#arrow)"/>
<text x="340.0" y="105" font-size="8.5" font-weight="400" text-anchor="middle">Configure DMA mappings</text>
<text x="340.0" y="115" font-size="8.5" font-weight="400" text-anchor="middle">and interrupts</text>
<path d="M285 121 H395" fill="none" stroke="#333" stroke-width="0.8" marker-end="url(#arrow)"/>
<text x="225.0" y="138" font-size="8.5" font-weight="400" text-anchor="middle">Guest memory</text>
<text x="225.0" y="148" font-size="8.5" font-weight="400" text-anchor="middle">transfer or reuse</text>
<path d="M165 154 H285" fill="none" stroke="#333" stroke-width="0.8" marker-end="url(#arrow)"/>
<rect x="5" y="170" width="430" height="18" fill="#eaeaea" stroke="none" stroke-width="0.6"/>
<text x="12" y="182.5" font-size="9.5" font-weight="600">2  Pause source and collect DMA changes</text>
<rect x="118" y="195" width="94" height="20" fill="white" stroke="#888" stroke-width="0.6"/>
<text x="165" y="207" font-size="8.5" font-weight="400" text-anchor="middle">Pause vCPUs</text>
<text x="110.0" y="228" font-size="8.5" font-weight="400" text-anchor="middle">Set state: STOP</text>
<path d="M165 234 H55" fill="none" stroke="#333" stroke-width="0.8" marker-end="url(#arrow)"/>
<text x="110.0" y="251" font-size="8.5" font-weight="400" text-anchor="middle">STOP complete</text>
<path d="M55 257 H165" fill="none" stroke="#333" stroke-width="0.8" marker-end="url(#arrow)" stroke-dasharray="3 2"/>
<text x="110.0" y="274" font-size="8.5" font-weight="400" text-anchor="middle">Request DMA dirty bitmap*</text>
<path d="M165 280 H55" fill="none" stroke="#333" stroke-width="0.8" marker-end="url(#arrow)"/>
<text x="110.0" y="298" font-size="8.5" font-weight="400" text-anchor="middle">DMA dirty bitmap*</text>
<path d="M55 304 H165" fill="none" stroke="#333" stroke-width="0.8" marker-end="url(#arrow)" stroke-dasharray="3 2"/>
<rect x="5" y="320" width="430" height="18" fill="#eaeaea" stroke="none" stroke-width="0.6"/>
<text x="12" y="332.5" font-size="9.5" font-weight="600">3  Transfer CPU and device state</text>
<text x="225.0" y="346" font-size="8.5" font-weight="400" text-anchor="middle">CPU state</text>
<path d="M165 352 H285" fill="none" stroke="#333" stroke-width="0.8" marker-end="url(#arrow)"/>
<text x="110.0" y="373" font-size="8.5" font-weight="400" text-anchor="middle">Set state: STOP_COPY</text>
<path d="M165 379 H55" fill="none" stroke="#333" stroke-width="0.8" marker-end="url(#arrow)"/>
<text x="340.0" y="373" font-size="8.5" font-weight="400" text-anchor="middle">Set state: RESUMING</text>
<path d="M285 379 H395" fill="none" stroke="#333" stroke-width="0.8" marker-end="url(#arrow)"/>
<text x="110.0" y="400" font-size="8.5" font-weight="400" text-anchor="middle">MIG_DATA_READ</text>
<path d="M165 406 H55" fill="none" stroke="#333" stroke-width="0.8" marker-end="url(#arrow)"/>
<text x="110.0" y="424" font-size="8.5" font-weight="400" text-anchor="middle">Device-state data</text>
<path d="M55 430 H165" fill="none" stroke="#333" stroke-width="0.8" marker-end="url(#arrow)" stroke-dasharray="3 2"/>
<text x="225.0" y="448" font-size="8.5" font-weight="400" text-anchor="middle">Device-state stream</text>
<path d="M165 454 H285" fill="none" stroke="#333" stroke-width="0.8" marker-end="url(#arrow)"/>
<text x="340.0" y="472" font-size="8.5" font-weight="400" text-anchor="middle">MIG_DATA_WRITE</text>
<path d="M285 478 H395" fill="none" stroke="#333" stroke-width="0.8" marker-end="url(#arrow)"/>
<rect x="5" y="493" width="430" height="18" fill="#eaeaea" stroke="none" stroke-width="0.6"/>
<text x="12" y="505.5" font-size="9.5" font-weight="600">4  Restore and resume destination</text>
<rect x="238" y="519" width="94" height="20" fill="white" stroke="#888" stroke-width="0.6"/>
<text x="285" y="531" font-size="8.5" font-weight="400" text-anchor="middle">Restore CPU state</text>
<text x="340.0" y="555" font-size="8.5" font-weight="400" text-anchor="middle">Set state: STOP</text>
<path d="M285 561 H395" fill="none" stroke="#333" stroke-width="0.8" marker-end="url(#arrow)"/>
<text x="340.0" y="580" font-size="8.5" font-weight="400" text-anchor="middle">Set state: RUNNING</text>
<path d="M285 586 H395" fill="none" stroke="#333" stroke-width="0.8" marker-end="url(#arrow)"/>
<rect x="238" y="596" width="94" height="20" fill="white" stroke="#888" stroke-width="0.6"/>
<text x="285" y="608" font-size="8.5" font-weight="400" text-anchor="middle">Resume vCPUs</text>
</g></svg>